<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etudes - Practice Audio</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f0f4f8; }
  h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
  .back-link { color: #3498db; text-decoration: none; font-size: 0.9em; }
  .back-link:hover { text-decoration: underline; }
  .track { background: white; border-radius: 12px; padding: 20px; margin: 15px 0; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .track-name { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; color: #2c3e50; }
  .track-desc { color: #777; font-size: 0.85em; margin-bottom: 10px; }
  audio { width: 100%; margin-bottom: 10px; }
  .speed-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .speed-label { font-size: 0.8em; color: #888; margin-right: 4px; }
  .speed-btn { padding: 4px 10px; border: 1.5px solid #3498db; border-radius: 20px; background: white; color: #3498db; font-size: 0.82em; cursor: pointer; transition: all 0.15s; }
  .speed-btn:hover { background: #eaf4fd; }
  .speed-btn.active { background: #3498db; color: white; font-weight: bold; }
</style>
</head>
<body>
<a class="back-link" href="index.html">← Practice Audio トップへ</a>
<h1>📖 エチュード</h1>

<div class="track">
  <div class="track-name">Blazhevich — エチュード No.1</div>
  <div class="track-desc">ブラジェヴィチ</div>
  <audio id="audio0" controls preload="none">
    <source src="Etudes/Blazhevich%EF%BC%91.m4a" type="audio/mp4">
  </audio>
  <div class="speed-controls">
    <span class="speed-label">速度：</span>
    <button class="speed-btn" onclick="setSpeed('audio0',0.5,this)">0.5</button>
    <button class="speed-btn" onclick="setSpeed('audio0',0.6,this)">0.6</button>
    <button class="speed-btn" onclick="setSpeed('audio0',0.7,this)">0.7</button>
    <button class="speed-btn" onclick="setSpeed('audio0',0.8,this)">0.8</button>
    <button class="speed-btn" onclick="setSpeed('audio0',0.9,this)">0.9</button>
    <button class="speed-btn active" onclick="setSpeed('audio0',1.0,this)">1.0</button>
  </div>
</div>

<div class="track">
  <div class="track-name">Grigoriev — エチュード No.1</div>
  <div class="track-desc">グレゴリエフ</div>
  <audio id="audio1" controls preload="none">
    <source src="Etudes/Grigoriev1.m4a" type="audio/mp4">
  </audio>
  <div class="speed-controls">
    <span class="speed-label">速度：</span>
    <button class="speed-btn" onclick="setSpeed('audio1',0.5,this)">0.5</button>
    <button class="speed-btn" onclick="setSpeed('audio1',0.6,this)">0.6</button>
    <button class="speed-btn" onclick="setSpeed('audio1',0.7,this)">0.7</button>
    <button class="speed-btn" onclick="setSpeed('audio1',0.8,this)">0.8</button>
    <button class="speed-btn" onclick="setSpeed('audio1',0.9,this)">0.9</button>
    <button class="speed-btn active" onclick="setSpeed('audio1',1.0,this)">1.0</button>
  </div>
</div>

<script>
function setSpeed(audioId, speed, btn) {
  const audio = document.getElementById(audioId);
  audio.playbackRate = speed;
  const btns = btn.parentElement.querySelectorAll('.speed-btn');
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
