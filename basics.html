  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #fdf6f0; }
  h1 { color: #2c3e50; border-bottom: 3px solid #e67e22; padding-bottom: 10px; }
  .back-link { color: #e67e22; text-decoration: none; font-size: 0.9em; }
  .back-link:hover { text-decoration: underline; }
  .track { background: white; border-radius: 12px; padding: 20px; margin: 15px 0; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .track-name { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; color: #2c3e50; }
  audio { width: 100%; margin-bottom: 10px; }
  .speed-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .speed-label { font-size: 0.8em; color: #888; margin-right: 4px; }
  .speed-btn { padding: 4px 10px; border: 1.5px solid #e67e22; border-radius: 20px; background: white; color: #e67e22; font-size: 0.82em; cursor: pointer; transition: all 0.15s; }
  .speed-btn:hover { background: #fef0e6; }
  .speed-btn.active { background: #e67e22; color: white; font-weight: bold; }

<a class="back-link" href="index.html">← Practice Audio トップへ</a>

<script>
function setSpeed(audioId, speed, btn) {
  const audio = document.getElementById(audioId);
  audio.playbackRate = speed;
  const btns = btn.parentElement.querySelectorAll('.speed-btn');
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
